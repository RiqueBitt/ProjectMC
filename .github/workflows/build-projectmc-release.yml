name: Build ProjectMC release

# Empacota este launcher (fork "GoldApple Launcher") no formato exato que
# o módulo ProjectMC do Project Club espera consumir — ver handoff
# "Integração do ProjectMC no Project Club": ProjectMC.exe (Windows,
# pasta desempacotada) + ProjectMC.AppImage (Linux, sozinho), publicados
# como uma release neste repositório (RiqueBitt/ProjectMC).
#
# NUNCA use este workflow pra publicar uma release "normal" do launcher
# pro público em geral (isso já existe via outros workflows deste
# repositório) — este é só pro pacote consumido pelo Project Club.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar (ex: 1.0.0) — usada na tag e no nome dos arquivos'
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '11.10.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: pnpm install
      - run: pnpm run build:renderer
      - name: Build Windows (portável, sem instalador nem pasta de arquivos)
        working-directory: xmcl-electron-app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Item pedido (correção): "nos releases do ProjectMC não tem
          # nenhum .AppImage" — na verdade tinha (confirmado: v1.4.0 já
          # publicava o AppImage), mas ficava escondido na prática:
          # este mesmo repositório de releases também recebe as
          # releases do fluxo PÚBLICO normal do launcher (workflow
          # separado, tags "v44"/"v45"/etc, sem AppImage nenhum) — o
          # GitHub sempre destaca UMA release como "Latest" no topo da
          # página, e qualquer um dos dois fluxos que rodar por último
          # "rouba" esse destaque do outro. --latest=false garante que
          # release nunca vira o destaque visual da página (mesmo
          # sendo sempre encontrada certinho pelo código do Project
          # Club, que já filtra por tag semver "vX.Y.Z" — não depende
          # do destaque "Latest" pra funcionar).
          gh release create "v${{ inputs.version }}" \
            dist/projectmc-win/projectmc-${{ inputs.version }}-win.exe \
            dist/projectmc-linux/projectmc-${{ inputs.version }}-linux.AppImage \
            --repo ${{ github.repository }} \
            --target ${{ github.sha }} \
            --title "ProjectMC v${{ inputs.version }}" \
            --notes "Build automática do ProjectMC — launcher de Minecraft opcional do Project Club." \
            --latest=false
